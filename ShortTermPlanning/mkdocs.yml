site_name: Dynreact ShortTermPlanning

site_url: ""
use_directory_urls: false


docs_dir: docs
extra:
  source_dir: dynreact

theme:
  name: "readthedocs"
  color_mode: light
  highlightjs: true


plugins:
- mkdocstrings:
    handlers:
      python:
        paths: [.]
        options:
          members_order: source
          show_source: false
          docstring_section_style: table
          docstring_style: sphinx

nav:
  - Back: ../index.html
  - General: index.md
  - Agent: agent.md
  - Material: material.md
  - Equipment: equipment.md
  - Common: common.md
  - Handler: handler.md
  - Deployment and Registry: deployment.md
  - Log: log.md
  - Functions: functions.md
  - Shared messaging and concurrency: shared_messaging.md
  - Kafka clean-up: cleankafka.md
  - ShortTermPlanning: shorttermplanning.md
